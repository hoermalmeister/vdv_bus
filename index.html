<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV - Offset tras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); padding: 10px 20px;
            border-radius: 8px; z-index: 9999; font-family: sans-serif; font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="loading">Načítání trasy.geojson...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.min.js"></script>

    <script>
        // Úmyslně bez preferCanvas: true, aby správně fungoval offset plugin!
        // (Díky GeoJSONu je to teď dostatečně rychlé i přes SVG)
        const map = L.map('map').setView([49.4, 15.6], 9); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const colors = ['#e6194B', '#3cb44b', '#f58231', '#4363d8', '#911eb4', '#42d4f4', '#f032e6', '#469990', '#dcbeff', '#9A6324', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075'];
        
        // Rozestupy linek od středu silnice v pixelech
        const offsetPixels = [-9, -6, -3, 0, 3, 6, 9];

        function getStyleForGroup(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) hash = group.charCodeAt(i) + ((hash << 5) - hash);
            const absHash = Math.abs(hash);
            
            return {
                color: colors[absHash % colors.length],
                offset: offsetPixels[absHash % offsetPixels.length]
            };
        }

        const linesLayer = L.layerGroup().addTo(map);
        const stopsLayer = L.layerGroup();

        fetch('trasy.geojson')
            .then(response => {
                if (!response.ok) throw new Error("Soubor trasy.geojson nebyl nalezen.");
                return response.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 4, color: '#000', weight: 1, fillColor: '#fff', fillOpacity: 1
                        }).bindTooltip(feature.properties.name);
                    },
                    style: function(feature) {
                        if (feature.geometry.type === "LineString") {
                            const st = getStyleForGroup(feature.properties.group);
                            return {
                                color: st.color,
                                weight: 3,
                                opacity: 0.8,
                                offset: st.offset, // Využití posunu
                                lineCap: 'round',
                                lineJoin: 'round'
                            };
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.geometry.type === "LineString") {
                            layer.bindTooltip(`Linka: ${feature.properties.group}`, { sticky: true });
                            linesLayer.addLayer(layer);
                        } else if (feature.geometry.type === "Point") {
                            stopsLayer.addLayer(layer);
                        }
                    }
                });

                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                document.getElementById('loading').innerText = "Chyba: " + error.message;
                document.getElementById('loading').style.background = "#e74c3c";
                document.getElementById('loading').style.color = "#fff";
            });

        map.on('zoomend', function() {
            if (map.getZoom() >= 13) {
                if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
            } else {
                if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
            }
        });
    </script>
</body>
</html>
