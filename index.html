<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV - Všechny varianty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; text-align: center; padding: 20px;
        }
        .spinner {
            border: 8px solid #f3f3f3; border-top: 8px solid #3498db;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2 id="loading-text">Načítání struktury linek...</h2>
        <p>Zpracování všech variant tras může chvíli trvat.</p>
    </div>
    <div id="map"></div>

    <!-- Knihovny pro mapu, posun čar (offset) a parsování -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const baseUrl = "https://hoermalmeister.github.io/gtfs-rehost/vdv/";

        // Barevná paleta pro linky
        const colors = ['#e6194B', '#3cb44b', '#f58231', '#4363d8', '#911eb4', '#42d4f4', '#f032e6', '#469990', '#dcbeff', '#9A6324', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075'];

        function loadCSV(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(baseUrl + file, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data),
                    error: reject
                });
            });
        }

        // Pomocná funkce, která pro název linky vygeneruje vždy stejnou barvu a odsazení (offset)
        function getGroupStyle(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) {
                hash = group.charCodeAt(i) + ((hash << 5) - hash);
            }
            const absHash = Math.abs(hash);
            // Výpočet odsazení: rozprostřeme linky od -6 do +6 pixelů
            const offsets = [-6, -4, -2, 0, 2, 4, 6];
            return {
                color: colors[absHash % colors.length],
                offset: offsets[absHash % offsets.length]
            };
        }

        async function initMap() {
            try {
                const loadingText = document.getElementById('loading-text');

                // 1. Stáhnutí základních souborů
                loadingText.innerText = "Načítání linek, spojů a zastávek...";
                const [routes, trips, stops] = await Promise.all([
                    loadCSV("routes.txt"),
                    loadCSV("trips.txt"),
                    loadCSV("stops.txt")
                ]);

                // 2. Indexace zastávek
                const stopsMap = {};
                stops.forEach(s => {
                    stopsMap[s.stop_id] = { lat: parseFloat(s.stop_lat), lon: parseFloat(s.stop_lon), name: s.stop_name };
                });

                // 3. Seskupení linek dle posledních 3 čísel
                const routesMap = {}; 
                routes.forEach(r => {
                    let name = r.route_short_name ? r.route_short_name.toString().trim() : "";
                    let group = name.slice(-3);
                    if(group) {
                        routesMap[r.route_id] = { group, originalName: name };
                    }
                });

                // 4. Namapování spojů na skupiny linek
                const tripToGroupMap = {};
                trips.forEach(t => {
                    if (routesMap[t.route_id]) {
                        tripToGroupMap[t.trip_id] = routesMap[t.route_id].group;
                    }
                });

                // 5. Streamované načítání stop_times
                loadingText.innerText = "Skládám všechny varianty tras...";
                const tripStops = {}; 

                await new Promise((resolve, reject) => {
                    Papa.parse(baseUrl + "stop_times.txt", {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        step: function(row) {
                            const st = row.data;
                            if (st.trip_id && tripToGroupMap[st.trip_id]) {
                                if (!tripStops[st.trip_id]) tripStops[st.trip_id] = [];
                                tripStops[st.trip_id].push({
                                    stop_id: st.stop_id,
                                    seq: parseInt(st.stop_sequence)
                                });
                            }
                        },
                        complete: resolve,
                        error: reject
                    });
                });

                loadingText.innerText = "Vykreslování mapy (filtrace duplicitních tvarů)...";

                // 6. Filtrace: Najdeme všechny UNIKÁTNÍ tvary tras pro každou skupinu
                // Pokud jede linka 10x denně po absolutně stejných zastávkách, vykreslíme ji jen jednou.
                const uniqueRouteShapes = []; 
                const shapeHashesPerGroup = {}; // group -> set(hashes)

                Object.keys(tripStops).forEach(trip_id => {
                    const group = tripToGroupMap[trip_id];
                    const stopsList = tripStops[trip_id];
                    
                    // Seřadit podle času/sekvence
                    stopsList.sort((a, b) => a.seq - b.seq);
                    
                    // Vytvoříme otisk ("hash") tvaru trasy z IDček zastávek
                    const shapeHash = stopsList.map(st => st.stop_id).join('|');

                    if (!shapeHashesPerGroup[group]) {
                        shapeHashesPerGroup[group] = new Set();
                    }

                    // Pokud jsme tuto přesnou variantu pro tuto linku ještě neviděli, uložíme ji
                    if (!shapeHashesPerGroup[group].has(shapeHash)) {
                        shapeHashesPerGroup[group].add(shapeHash);
                        uniqueRouteShapes.push({
                            group: group,
                            stops: stopsList
                        });
                    }
                });

                // 7. Inicializace mapy
                const map = L.map('map').setView([49.4, 15.6], 9); 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);

                const usedStops = new Set();

                // 8. Vykreslení všech unikátních variant
                uniqueRouteShapes.forEach(shape => {
                    const latlngs = [];
                    shape.stops.forEach(st => {
                        const stop = stopsMap[st.stop_id];
                        if (stop && !isNaN(stop.lat) && !isNaN(stop.lon)) {
                            latlngs.push([stop.lat, stop.lon]);
                            usedStops.add(st.stop_id);
                        }
                    });

                    if (latlngs.length > 1) {
                        const style = getGroupStyle(shape.group);

                        // Použití offsetu z pluginu
                        L.polyline(latlngs, {
                            color: style.color,
                            weight: 3,
                            opacity: 0.8,
                            offset: style.offset // Toto roztáhne linky vedle sebe!
                        }).bindTooltip(`Linka: ${shape.group}`, { sticky: true }).addTo(map);
                    }
                });

                // 9. Vrstva zastávek (objeví se pouze při blízkém zoomu 14+)
                const stopsLayer = L.layerGroup();
                usedStops.forEach(stop_id => {
                    const stop = stopsMap[stop_id];
                    L.circleMarker([stop.lat, stop.lon], {
                        radius: 4,
                        color: '#000',
                        weight: 1,
                        fillColor: '#fff',
                        fillOpacity: 1
                    }).bindTooltip(stop.name).addTo(stopsLayer);
                });

                map.on('zoomend', function() {
                    if (map.getZoom() >= 14) {
                        if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
                    } else {
                        if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
                    }
                });

                // Konec - skrytí načítání
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error("Chyba:", error);
                document.getElementById('loading-text').innerText = "Vyskytla se chyba při zpracování. Zkontroluj konzoli prohlížeče (F12).";
            }
        }

        initMap();
    </script>
</body>
</html>
