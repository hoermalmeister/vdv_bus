<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV - Plynulé UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); color: #fff; padding: 10px 20px;
            border-radius: 8px; z-index: 9999; font-family: sans-serif; font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        .stop-label {
            background: rgba(15, 15, 15, 0.85) !important;
            border: 1px solid #444 !important;
            color: #58d68d !important;
            font-family: 'Courier New', monospace;
            font-weight: bold; font-size: 11px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            border-radius: 4px; padding: 2px 4px;
        }
        .stop-label::before { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">Načítání trasy.geojson...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', { 
            preferCanvas: true,
            minZoom: 10,
            maxZoom: 15
        }).setView([49.4, 15.6], 10); 

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            minZoom: 10, maxZoom: 15
        }).addTo(map);

        const neonColors = ['#ff3366', '#33ff66', '#ff9933', '#33ccff', '#cc33ff', '#ffff33', '#ff33ff', '#33ffff', '#ff6666', '#66ff66', '#ffb366', '#66b3ff', '#ff99ff', '#99ffff'];

        function getColorForGroup(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) hash = group.charCodeAt(i) + ((hash << 5) - hash);
            return neonColors[Math.abs(hash) % neonColors.length];
        }

        const linesLayer = L.layerGroup().addTo(map);
        const stopsLayer = L.layerGroup(); 

        fetch('trasy.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        const rawZone = feature.properties.zone || "";
                        const vZones = rawZone.split(',').map(z => z.trim()).filter(z => z.startsWith('V'));

                        if (vZones.length === 0) return null;
                        const fullLabelText = feature.properties.name + " [" + vZones.join(',') + "]";

                        return L.circleMarker(latlng, {
                            radius: 4, color: '#fff', weight: 1.5, fillColor: '#58d68d', fillOpacity: 1
                        }).bindTooltip(fullLabelText, { 
                            permanent: true, direction: 'top', className: 'stop-label', offset: [0, -5]
                        });
                    },
                    style: function(feature) {
                        if (feature.geometry.type === "MultiLineString" || feature.geometry.type === "LineString") {
                            return {
                                color: getColorForGroup(feature.properties.group),
                                weight: 4, opacity: 0.9, lineCap: 'round', lineJoin: 'round'
                            };
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.geometry.type === "MultiLineString" || feature.geometry.type === "LineString") {
                            layer.bindTooltip(`Linka: ${feature.properties.group}`, { sticky: true });
                            linesLayer.addLayer(layer);
                        } else if (feature.geometry.type === "Point" && layer) {
                            stopsLayer.addLayer(layer);
                        }
                    }
                });
                
                checkZoomLevel();
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                document.getElementById('loading').innerText = "Chyba při načítání GeoJSON dat.";
            });

        function checkZoomLevel() {
            // ZMĚNA: Popisky se zapnou výhradně a pouze na zoomu 15
            if (map.getZoom() === 15) {
                if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
            } else {
                if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
            }
        }

        map.on('zoomend', checkZoomLevel);
    </script>
</body>
</html>
