<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV - Finální čistá verze</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; text-align: center; padding: 20px;
        }
        .spinner {
            border: 8px solid #f3f3f3; border-top: 8px solid #3498db;
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2 id="loading-text">Načítání struktury linek...</h2>
        <p>Vypočítávám přesné souřadnice posunutých linek (bez pluginů).</p>
    </div>
    <div id="map"></div>

    <!-- Knihovny pro mapu a parsování (plugin polylineoffset jsme odstranili) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const baseUrl = "https://hoermalmeister.github.io/gtfs-rehost/vdv/";
        const colors = ['#e6194B', '#3cb44b', '#f58231', '#4363d8', '#911eb4', '#42d4f4', '#f032e6', '#469990', '#dcbeff', '#9A6324', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075'];

        function loadCSV(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(baseUrl + file, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data),
                    error: reject
                });
            });
        }

        // Vlastní matematická funkce pro fyzický posun úseku na mapě o X metrů kolmo k silnici
        function offsetSegment(lat1, lon1, lat2, lon2, offsetMeters) {
            if (offsetMeters === 0) return [[lat1, lon1], [lat2, lon2]];
            
            const meterToLat = 1 / 111320; // 1 stupeň = cca 111 320 metrů
            const latMid = (lat1 + lat2) / 2;
            const cosLat = Math.cos(latMid * Math.PI / 180);
            
            const dy = (lat2 - lat1) / meterToLat;
            const dx = (lon2 - lon1) * cosLat / meterToLat;
            const length = Math.sqrt(dx*dx + dy*dy);
            
            if (length === 0) return [[lat1, lon1], [lat2, lon2]];
            
            // Kolmý vektor k silnici
            const nx = -dy / length;
            const ny = dx / length;
            
            const dLat = ny * offsetMeters * meterToLat;
            const dLon = nx * offsetMeters * meterToLat / cosLat;
            
            return [
                [lat1 + dLat, lon1 + dLon],
                [lat2 + dLat, lon2 + dLon]
            ];
        }

        function getGroupStyle(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) {
                hash = group.charCodeAt(i) + ((hash << 5) - hash);
            }
            const absHash = Math.abs(hash);
            // Definice rozestupů linek v reálných METRECH vedle sebe
            const offsets = [-120, -80, -40, 0, 40, 80, 120]; 
            return {
                color: colors[absHash % colors.length],
                offsetMeters: offsets[absHash % offsets.length]
            };
        }

        async function initMap() {
            try {
                const loadingText = document.getElementById('loading-text');

                loadingText.innerText = "Načítání linek, spojů a zastávek...";
                const [routes, trips, stops] = await Promise.all([
                    loadCSV("routes.txt"),
                    loadCSV("trips.txt"),
                    loadCSV("stops.txt")
                ]);

                const stopsMap = {};
                stops.forEach(s => {
                    if (s.stop_lat && s.stop_lon) {
                        stopsMap[s.stop_id] = { lat: parseFloat(s.stop_lat), lon: parseFloat(s.stop_lon), name: s.stop_name };
                    }
                });

                const routesMap = {}; 
                routes.forEach(r => {
                    let name = r.route_short_name ? r.route_short_name.toString().trim() : "";
                    let group = name.slice(-3);
                    if(group) {
                        routesMap[r.route_id] = { group, originalName: name };
                    }
                });

                const tripToGroupMap = {};
                trips.forEach(t => {
                    if (routesMap[t.route_id]) {
                        tripToGroupMap[t.trip_id] = routesMap[t.route_id].group;
                    }
                });

                loadingText.innerText = "Zpracování jízdních řádů...";
                const tripStops = {}; 

                await new Promise((resolve, reject) => {
                    Papa.parse(baseUrl + "stop_times.txt", {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        step: function(row) {
                            const st = row.data;
                            if (st.trip_id && tripToGroupMap[st.trip_id]) {
                                if (!tripStops[st.trip_id]) tripStops[st.trip_id] = [];
                                tripStops[st.trip_id].push({
                                    stop_id: st.stop_id,
                                    seq: parseInt(st.stop_sequence)
                                });
                            }
                        },
                        complete: resolve,
                        error: reject
                    });
                });

                loadingText.innerText = "Skládání chytré sítě úseků...";

                const groupSegments = {}; 
                const usedStops = new Set();

                Object.keys(tripStops).forEach(trip_id => {
                    const group = tripToGroupMap[trip_id];
                    if (!groupSegments[group]) {
                        groupSegments[group] = new Set();
                    }
                    
                    const stopsList = tripStops[trip_id];
                    stopsList.sort((a, b) => a.seq - b.seq);

                    for (let i = 0; i < stopsList.length - 1; i++) {
                        let id1 = stopsList[i].stop_id;
                        let id2 = stopsList[i+1].stop_id;
                        
                        if (id1 === id2) continue; 
                        
                        let segmentKey = id1 < id2 ? `${id1}|${id2}` : `${id2}|${id1}`;
                        
                        groupSegments[group].add(segmentKey);
                        usedStops.add(id1);
                        usedStops.add(id2);
                    }
                });

                // ZAPNUTO preferCanvas = obrovský nárůst výkonu
                const map = L.map('map', { preferCanvas: true }).setView([49.4, 15.6], 9); 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);

                // VYKRESLENÍ SEGMENTŮ s vlastním matematickým výpočtem pozice
                Object.keys(groupSegments).forEach(group => {
                    const style = getGroupStyle(group);
                    const segmentsArray = Array.from(groupSegments[group]);
                    const multiLatLngs = [];
                    
                    segmentsArray.forEach(segKey => {
                        const [id1, id2] = segKey.split('|');
                        const stop1 = stopsMap[id1];
                        const stop2 = stopsMap[id2];
                        
                        if (stop1 && stop2 && !isNaN(stop1.lat) && !isNaN(stop1.lon) && !isNaN(stop2.lat) && !isNaN(stop2.lon)) {
                            // Upravíme souřadnice přesně na míru ještě před vykreslením
                            const offsetCoords = offsetSegment(stop1.lat, stop1.lon, stop2.lat, stop2.lon, style.offsetMeters);
                            multiLatLngs.push(offsetCoords);
                        }
                    });

                    if (multiLatLngs.length > 0) {
                        L.polyline(multiLatLngs, {
                            color: style.color,
                            weight: 3,
                            opacity: 0.8,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).bindTooltip(`Linka: ${group}`, { sticky: true }).addTo(map);
                    }
                });

                // Vrstva zastávek
                const stopsLayer = L.layerGroup();
                usedStops.forEach(stop_id => {
                    const stop = stopsMap[stop_id];
                    if(stop && !isNaN(stop.lat) && !isNaN(stop.lon)) {
                        L.circleMarker([stop.lat, stop.lon], {
                            radius: 4,
                            color: '#000',
                            weight: 1,
                            fillColor: '#fff',
                            fillOpacity: 1
                        }).bindTooltip(stop.name).addTo(stopsLayer);
                    }
                });

                map.on('zoomend', function() {
                    if (map.getZoom() >= 14) {
                        if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
                    } else {
                        if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
                    }
                });

                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error("Chyba:", error);
                document.getElementById('loading-text').innerText = "Vyskytla se chyba. Podrobnosti v F12 konzoli prohlížeče.";
            }
        }

        initMap();
    </script>
</body>
</html>
