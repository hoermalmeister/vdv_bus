<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); color: #fff; padding: 10px 20px;
            border-radius: 8px; z-index: 9999; font-family: sans-serif; font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); border: 1px solid #333;
        }

        /* Stylování popisků zastávek pro Dark UI */
        .stop-label {
            background: rgba(15, 15, 15, 0.85) !important;
            border: 1px solid #444 !important;
            color: #58d68d !important; /* Svítivě zelený text */
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            border-radius: 4px;
            padding: 2px 4px;
        }
        /* Odstranění šipek u permanentních popisků, aby neclonily čáry */
        .stop-label::before { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">Načítání trasy.geojson...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializace s limity přiblížení: minZoom 10, maxZoom 15
        const map = L.map('map', { 
            preferCanvas: true,
            minZoom: 10,
            maxZoom: 15
        }).setView([49.4, 15.6], 10); 

        // Moderní Dark UI mapové podklady (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            minZoom: 10,
            maxZoom: 15
        }).addTo(map);

        // Speciální zářivá neonová paleta upravená pro perfektní kontrast na tmavé mapě
        const neonColors = ['#ff3366', '#33ff66', '#ff9933', '#33ccff', '#cc33ff', '#ffff33', '#ff33ff', '#33ffff', '#ff6666', '#66ff66', '#ffb366', '#66b3ff', '#ff99ff', '#99ffff'];

        function getColorForGroup(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) hash = group.charCodeAt(i) + ((hash << 5) - hash);
            return neonColors[Math.abs(hash) % neonColors.length];
        }

        const linesLayer = L.layerGroup().addTo(map);
        const stopsLayer = L.layerGroup(); // Vrstva pro zastávky se zapne až při velkém přiblížení

        fetch('trasy.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        const rawZone = feature.properties.zone || "";
                        
                        // Rozsekáme zóny podle čárek a najdeme pouze ty, které začínají na "V"
                        const vZones = rawZone.split(',')
                                               .map(z => z.trim())
                                               .filter(z => z.startsWith('V'));

                        // POUZE TY S V---: Pokud zastávka nemá žádnou "V" zónu, úplně ji přeskočíme
                        if (vZones.length === 0) return null;

                        // Sestavení textu: Název zastávky + zóny (např. Jihlava (V100, V101))
                        const fullLabelText = feature.properties.name + " [" + vZones.join(',') + "]";

                        // Vytvoření bodu se stálým (permanentním) popiskem na mapě
                        return L.circleMarker(latlng, {
                            radius: 4, 
                            color: '#fff', 
                            weight: 1.5, 
                            fillColor: '#58d68d', 
                            fillOpacity: 1
                        }).bindTooltip(fullLabelText, { 
                            permanent: true,       // Zobrazí se automaticky bez nutnosti najíždět myší
                            direction: 'top', 
                            className: 'stop-label',
                            offset: [0, -5]
                        });
                    },
                    style: function(feature) {
                        if (feature.geometry.type === "MultiLineString") {
                            return {
                                color: getColorForGroup(feature.properties.group),
                                weight: 4, // Lehce tlustší čáry pro parádní svítivý efekt
                                opacity: 0.9,
                                lineCap: 'round',
                                lineJoin: 'round'
                            };
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.geometry.type === "MultiLineString") {
                            layer.bindTooltip(`Linka: ${feature.properties.group}`, { sticky: true });
                            linesLayer.addLayer(layer);
                        } else if (feature.geometry.type === "Point" && layer) {
                            // Layer mohl být přeskočen (return null výše), tak ukládáme jen platné V-zastávky
                            stopsLayer.addLayer(layer);
                        }
                    }
                });
                
                // Kontrola zoomu ihned po načtení
                checkZoomLevel();
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                document.getElementById('loading').innerText = "Chyba při načítání GeoJSON dat.";
            });

        // Logika pro zobrazení zastávek: zapnou se pouze při velmi blízkém přiblížení (zoom 14 a 15)
        function checkZoomLevel() {
            if (map.getZoom() >= 14) {
                if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
            } else {
                if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
            }
        }

        map.on('zoomend', checkZoomLevel);
    </script>
</body>
</html>
