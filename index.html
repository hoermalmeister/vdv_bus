<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>Mapa autobusů VDV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); padding: 10px 20px;
            border-radius: 8px; z-index: 9999; font-family: sans-serif; font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="loading">Načítání trasy.geojson...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Plná Canvas akcelerace – bleskové a plynulé načítání
        const map = L.map('map', { preferCanvas: true }).setView([49.4, 15.6], 9); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const colors = ['#e6194B', '#3cb44b', '#f58231', '#4363d8', '#911eb4', '#42d4f4', '#f032e6', '#469990', '#dcbeff', '#9A6324', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075'];

        function getColorForGroup(group) {
            let hash = 0;
            for (let i = 0; i < group.length; i++) hash = group.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        const linesLayer = L.layerGroup().addTo(map);
        const stopsLayer = L.layerGroup();

        fetch('trasy.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 4, color: '#000', weight: 1, fillColor: '#fff', fillOpacity: 1
                        }).bindTooltip(feature.properties.name);
                    },
                    style: function(feature) {
                        // Vykreslení optimalizovaných MultiLineString tras
                        if (feature.geometry.type === "MultiLineString") {
                            return {
                                color: getColorForGroup(feature.properties.group),
                                weight: 4,
                                opacity: 0.85,
                                lineCap: 'round',
                                lineJoin: 'round'
                            };
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.geometry.type === "MultiLineString") {
                            layer.bindTooltip(`Linka: ${feature.properties.group}`, { sticky: true });
                            linesLayer.addLayer(layer);
                        } else if (feature.geometry.type === "Point") {
                            stopsLayer.addLayer(layer);
                        }
                    }
                });
                document.getElementById('loading').style.display = 'none';
            })
            .catch(error => {
                document.getElementById('loading').innerText = "Chyba při načítání dat.";
            });

        // Schovávání / ukazování zastávek podle zoomu
        map.on('zoomend', function() {
            if (map.getZoom() >= 13) {
                if (!map.hasLayer(stopsLayer)) map.addLayer(stopsLayer);
            } else {
                if (map.hasLayer(stopsLayer)) map.removeLayer(stopsLayer);
            }
        });
    </script>
</body>
</html>
